name: CI/CD Full Deployment On Linode Server

on:
  push:
    branches:
      - develop

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build backend
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Angular app
        run: |
          cd frontend
          npx ng build frontend --configuration production

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -t bloodpressure-backend:latest backend
          docker save bloodpressure-backend:latest -o backend.tar

      - name: Build frontend Docker image
        run: |
          docker build -t bloodpressure-frontend:latest frontend
          docker save bloodpressure-frontend:latest -o frontend.tar

      - name: Upload backend TAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-tar
          path: backend.tar

      - name: Upload frontend TAR
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tar
          path: frontend.tar

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download backend TAR
        uses: actions/download-artifact@v4
        with:
          name: backend-tar
          path: .

      - name: Download frontend TAR
        uses: actions/download-artifact@v4
        with:
          name: frontend-tar
          path: .

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy Docker images to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          scp backend.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/github/backend.tar
          scp frontend.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/github/frontend.tar

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "docker load -i /root/github/backend.tar"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "docker load -i /root/github/frontend.tar"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd /root/github && docker compose down || true"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd /root/github && docker compose up -d"
