name: CI/CD Backend Deployment

on:
  push:
    branches:
      - develop

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t bloodpressure-backend:latest .
          docker save bloodpressure-backend:latest -o backend.tar

      - name: Upload Docker TAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-tar
          path: backend.tar

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker TAR
        uses: actions/download-artifact@v4
        with:
          name: backend-tar
          path: .

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy Docker image to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          scp backend.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/github/backend.tar

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "docker load -i /root/github/backend.tar"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd /root/github && docker compose down || true"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd /root/github && docker compose up -d"
