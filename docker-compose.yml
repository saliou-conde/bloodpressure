version: '3.9'

services:
  backend:
    image: sconde87/bloodpressure:latest
    container_name: bloodpressure-backend
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: sconde87/bloodpressure-frontend:latest
    container_name: bloodpressure-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
