<div class="container mt-5" style="max-width: 450px;">
  <div class="card p-4 shadow-sm">
    <h2 class="mb-3 text-primary text-center">Reset Password</h2>

    @if (successMessage) {
    <div class="alert alert-success py-2 mb-3">
      {{ successMessage }}
    </div>
    }

    @if (errorMessage) {
    <div class="alert alert-danger py-2 mb-3">
      {{ errorMessage }}
    </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          placeholder="Enter your username"
          [(ngModel)]="resetData.username"
          name="username"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          class="form-control"
          placeholder="name@example.com"
          [(ngModel)]="resetData.email"
          name="email"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            placeholder="Enter new password"
            [(ngModel)]="resetData.newPassword"
            name="newPassword"
            required>
          <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          placeholder="Confirm new password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required>
      </div>

      <button type="submit" class="btn btn-success w-100 mb-3" [disabled]="loading">
        @if (loading) {
        <span class="spinner-border spinner-border-sm me-1"></span>
        Updating...
        } @else {
        Update Password
        }
      </button>

      <div class="text-center">
        <small class="text-muted">
          Remembered your password? <a routerLink="/login">Login here</a>
        </small>
      </div>
    </form>
  </div>
</div>
